name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go SDK
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install rsrc Tool & Embed Windows Resources
        shell: pwsh
        run: |
          go install github.com/akavel/rsrc@latest
          rsrc -manifest srun.manifest -ico logo.ico -arch amd64 -o cmd/srun/rsrc_windows_amd64.syso
          rsrc -manifest srun.manifest -ico logo.ico -arch 386 -o cmd/srun/rsrc_windows_386.syso

      - name: Build Windows Binaries with Embedded Icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build_x64, build_x86, release_assets -Force | Out-Null
          
          # Build 64-bit with embedded icon
          go build -ldflags="-H windowsgui -s -w" -o build_x64/srun.exe ./cmd/srun
          Copy-Item build_x64/srun.exe release_assets/srun_windows_amd64.exe
          Compress-Archive -Path build_x64/srun.exe -DestinationPath release_assets/srun-windows-amd64.zip -Force

          # Build 32-bit with embedded icon
          $env:GOARCH = "386"
          go build -ldflags="-H windowsgui -s -w" -o build_x86/srun.exe ./cmd/srun
          $env:GOARCH = ""
          Copy-Item build_x86/srun.exe release_assets/srun_windows_386.exe
          Compress-Archive -Path build_x86/srun.exe -DestinationPath release_assets/srun-windows-386.zip -Force

          # Checksums
          Get-FileHash release_assets/* -Algorithm SHA256 | ForEach-Object {
              "$($_.Hash)  $(Split-Path $_.Path -Leaf)"
          } | Set-Content release_assets/checksums.sha256 -Encoding UTF8


      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
